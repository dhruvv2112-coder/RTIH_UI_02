name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static reference check
        run: node scripts/check.mjs
      - name: Unit tests (tokens contrast + offline queue)
        run: npm test
